plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'net.ltgt.errorprone' version '5.1.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// GameTests and their test datapack live in a separate source set so they never ship in the mod jar.
// They are bound to the mod in dev runs only (see neoForge.mods below).
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

base {
    archivesName = mod_id
}

// The dev runs load the example addon's source set (neoForge.mods below).
evaluationDependsOn(':example-addon')

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // JUnit-like XML report with the run time of every test (scripts/gametest.sh prints the slowest).
            programArguments.addAll '--report', file('build/gametest-report.xml').absolutePath
            // -Pgametests=<selector> runs only matching tests (namespaced ID with wildcards, e.g. civmod:delivery*).
            def gametests = providers.gradleProperty('gametests').getOrNull()
            if (gametests) {
                programArguments.addAll '--tests', gametests
            }
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
        // The example addon (example-addon/) runs in every dev run: client test and GameTests. Not in the mod jar.
        civmod_example {
            sourceSet(project(':example-addon').sourceSets.main)
        }
    }

    // Give the gametest source set access to Minecraft and NeoForge classes.
    addModdingDependenciesTo(sourceSets.gametest)
}

// 'localRuntime': runtime-only dependencies for dev runs that are not published as dependencies of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Mods for hand tests with modded items and ores. Runtime-only for dev runs; never in neoforge.mods.toml or the jar.
    devMods
}
// Off in CI and with -PnoDevMods (scripts/gametest.sh), so GameTests run without them.
// Every other local run loads them, runData and a plain runGameTestServer included.
if (System.getenv('CI') == null && !project.hasProperty('noDevMods')) {
    configurations.localRuntime.extendsFrom configurations.devMods
}

repositories {
    // Soft compat only: recipe viewer APIs are compile-only, CivMod runs without them.
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Unofficial Farmer's Delight port for 26.3 (MIT fork of vectorwing/FarmersDelight); dev runs only.
    // sha256 of FarmersDelight-26.3-1.3.3-fix6.jar: 1e52d6c476945fa8be3b7b9815b2423457f2a29a98c79ce3bd7ad2841b2ac055
    ivy {
        name = 'GitHub releases (Farmer\'s Delight port)'
        url = 'https://github.com/BuaichiZY/FarmersDelight_26_Neo.ver/releases/download'
        patternLayout {
            artifact '[revision]/[module].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'github.buaichizy'
        }
    }
    maven {
        name = 'shedaniel (REI)'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
}

dependencies {
    // Static analysis on every compile (see tasks.withType(JavaCompile) below).
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    // Ghost-ingredient drag for the Clerk's rule slots (soft compat, see compat/ packages).
    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.14.0.72'
    compileOnly('me.shedaniel:RoughlyEnoughItems-api-neoforge:26.3.824') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:22.0.3') { transitive = false }
    // REI's display widgets take its Point / Rectangle (the "Job Recipes" category).
    compileOnly('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }

    // JEI in dev runs only (runClient etc.); not published as a dependency.
    localRuntime 'mezz.jei:jei-26.3-neoforge:31.14.0.72'

    // Occultism with the mods it requires, for hand tests of the Miner and the Farmers with modded items.
    devMods 'maven.modrinth:occultism:26.3-neoforge-1.266.1'
    devMods 'maven.modrinth:geckolib:2s1O42FX' // 5.5.7 for NeoForge 26.3 (the plain number 5.5.7 resolved to another loader's file)
    devMods 'maven.modrinth:curios:NBT8yOsH' // 17.0.1+26.3 (version id: the '+' breaks a Maven path)
    devMods 'maven.modrinth:modonomicon:26.3-2.20.1'
    // Farmer's Delight port (release tag 26.3_Neo_fix6), for the Farmers and the Cook with modded items.
    devMods 'github.buaichizy:FarmersDelight-26.3-1.3.3-fix6:26.3_Neo_fix6@jar'
}

// Expands the ${} properties in src/main/templates (e.g. neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Warnings only for now: they show up in the build log without failing CI.
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/build/generated/.*'
        // Javadoc phrasing style; 95 hits of noise that would bury the real findings.
        disable('MissingSummary')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
